# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello

dotenv: ['.env']

includes:
  api:
    taskfile: ./backend/api/
    dir: ./backend/api/
  web:
    taskfile: ./frontend/web/
    dir: ./frontend/web/

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}, ${WORLD}!"
    silent: true

  # ===========================================
  # Local Development Tasks
  # ===========================================
  dev:
    desc: Run both backend and frontend in development mode
    deps:
      - task: api:run
      - task: web:dev

  # ===========================================
  # OpenAPI Tasks
  # ===========================================
  openapi:
    desc: Generate and preview OpenAPI documentation
    cmds:
      - task: openapi:generate
      - task: openapi:preview

  openapi:generate:
    desc: Generate Redoc from OpenAPI schema JSON file
    cmds:
      - pnpm run generate:redoc

  openapi:preview:
    desc: Preview API documentation in browser
    cmds:
      - echo "Opening OpenAPI documentation..."
      - echo "OpenAPI documentation available at http://localhost:18080/openapi.html"
      - echo "Press Ctrl+C to stop the server"
      - python3 -m http.server 18080 --directory docs/generated-openapi


  # ===========================================
  # Test Tasks
  # ===========================================
  test:setup:
    desc: Setup test environment
    cmds:
      - pnpm test:setup

  test:
    desc: Run all Playwright tests
    cmds:
      - pnpm test

  test:api:
    desc: Run API contract tests only
    cmds:
      - pnpm test:api

  test:scenario:
    desc: Run scenario workflow tests only
    cmds:
      - pnpm test:scenario

  test:e2e:
    desc: Run end-to-end UI tests
    cmds:
      - pnpm test:e2e

  test:ui:
    desc: Run tests with Playwright UI mode
    cmds:
      - pnpm test:ui

  test:report:
    desc: Show Playwright test report
    cmds:
      - pnpm test:report

