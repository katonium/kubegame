# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  setup:
    cmds:
      - echo "Execute pnpm install in root directory instead"

  dev:
    cmds:
      - task: run
  run:
    cmds:
      - pnpm run dev
